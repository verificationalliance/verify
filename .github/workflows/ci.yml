name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tests/test_cli.py prints statements with the real nanoda_bin of the v4.36.0 toolchain.
      - name: Get nanoda_bin from the pinned toolchain
        run: |
          read -r url sha < <(python3 -I -c 'import json, sys; t = json.load(open(sys.argv[1]))["v4.36.0"]; print(t["url"], t["sha256"])' vacheck/toolchains.json)
          curl -fsSL --proto '=https' --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" "$url"
          echo "$sha  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1 --wildcards '*/bin/nanoda_bin'
          rm "$RUNNER_TEMP/lean.tar.zst"
          echo "NANODA_BIN=$RUNNER_TEMP/lean/bin/nanoda_bin" >> "$GITHUB_ENV"

      - name: test_workflows
        run: python3 -I tests/test_workflows.py

      - name: test_vacheck
        run: python3 -I tests/test_vacheck.py

      - name: test_cli
        run: python3 -I tests/test_cli.py
