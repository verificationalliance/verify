# The Verification Alliance proof check for a Lean 4 project. Call it once per run, from a workflow
# of your own:
#
#   jobs:
#     verify:
#       uses: verificationalliance/verify/.github/workflows/lean.yml@<release sha>
#       permissions:
#         contents: read
#         id-token: write
#         attestations: write
#
# The trust boundary is the whole design:
# - `build` runs the project's code (its lakefile, `#eval`, `initialize`, ...). It has no id-token,
#   and everything it produces is untrusted.
# - `check` runs nothing from the repository and loads nothing that `build` made but the export,
#   as data: it replays the export through the official toolchain's kernels and compares it with
#   the toolchain's own libraries. It has no id-token either. Every native tool that reads the
#   export or names from it runs in a bwrap sandbox: no network, no environment, none of the
#   runner's files, only its inputs bound read-only.
# - `sign` runs no Lean and never sees the export. It receives result.json as a job output, never
#   as an artifact (any job in the run, `build` included, can upload an artifact), validates it,
#   checks that it is for this repository and commit, and has GitHub sign it.
#
# No text from the repository or the export reaches the log unescaped: the runner reads workflow
# commands in the log, and `check` and `sign` must not take any from the developer. vacheck's own
# messages are escaped; every other tool's output goes through say.py or into a file.
name: lean

on:
  workflow_call:
    inputs:
      manifest:
        description: The path of the manifest in the repository.
        type: string
        required: false
        default: .verificationalliance.json

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  MANIFEST: ${{ inputs.manifest }}
  VACHECK_URL: https://github.com/verificationalliance/verify/releases/download/v1.1.0/vacheck.pyz
  VACHECK_SHA256: 2d5afc846aade0a8653ca36adbeb6d06681b967e66d3218181eba37a3314ec22
  MAX_EXPORT: "2147483648" # 2 GiB
  # The base64 of vacheck's largest result (96,000 bytes). Job sign reads it from an environment
  # variable, and Linux caps one at 128 KiB: 131,064 characters pass and 131,072 fail.
  MAX_RESULT_B64: "128000"

jobs:
  build:
    name: build (untrusted)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - &checkout
        name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - &get-checker
        name: Get the checker
        run: |
          va="$RUNNER_TEMP/va"
          mkdir -p "$va"
          curl -fsSL --proto '=https' --retry 3 -o "$va/vacheck.pyz" "$VACHECK_URL"
          echo "$VACHECK_SHA256  $va/vacheck.pyz" | sha256sum -c -

          # say.py copies its input to the log, each line through vacheck's log_line, so that
          # nothing in it can be read as a workflow command. Lines are cut at 4096 bytes; of a long
          # log, the first 100 lines and the last 300 are shown, where a build says why it failed.
          cat > "$va/say.py" <<'EOF'
          import collections, sys
          sys.path.insert(0, sys.argv[1])
          from vacheck.text import log_line
          HEAD, TAIL = 100, 300
          shown, dropped, tail = 0, 0, collections.deque(maxlen=TAIL)
          while True:
              raw = sys.stdin.buffer.readline(4096)
              if not raw:
                  break
              line = log_line(raw.decode('utf-8', 'replace').rstrip('\n'))
              if shown < HEAD:
                  print(line, flush=True)
                  shown += 1
              else:
                  dropped += len(tail) == TAIL
                  tail.append(line)
          if dropped:
              print('(%d lines not shown)' % dropped)
          for line in tail:
              print(line)
          EOF

          # manifest_path.py checks the manifest input, in the checkout: a relative path without
          # `..`, to a file, through no symlink. It prints nothing of the path.
          cat > "$va/manifest_path.py" <<'EOF'
          import os, re, sys
          path = os.environ['MANIFEST']
          root = os.path.realpath('.')
          parts = path.split('/')
          if (not re.fullmatch(r'[A-Za-z0-9_.][A-Za-z0-9_./-]{0,254}', path) or '..' in parts
                  or os.path.realpath(path) != os.path.join(root, *[p for p in parts if p not in ('', '.')])
                  or not os.path.isfile(path)):
              print('::error::The manifest input must name a file in the repository by a relative path, '
                    'without .. and through no symlink.')
              sys.exit(1)
          EOF

          # theorems.py writes the theorem names the manifest claims, each followed by a NUL. It
          # runs after `vacheck modules`, which rejects a bad manifest with an escaped message.
          cat > "$va/theorems.py" <<'EOF'
          import sys
          sys.path.insert(0, sys.argv[1])
          from vacheck.manifest import MAX_BYTES, parse_manifest
          try:
              with open(sys.argv[2], 'rb') as f:
                  manifest = parse_manifest(f.read(MAX_BYTES + 1))
          except Exception:
              sys.exit('The manifest cannot be read.')
          sys.stdout.buffer.write(b''.join(c.theorem.encode('utf-8') + b'\0' for c in manifest.claims))
          EOF

          # kernels.py reads which kernels `lake check --paranoid` ran from its output, and writes
          # them as result.json names them. Only a kernel that lake both started and saw accept
          # counts, and one this workflow does not know fails the check: the result never names a
          # kernel that did not run.
          cat > "$va/kernels.py" <<'EOF'
          import sys
          KNOWN = {'Lean default': 'lean', 'Lean paranoid': 'leanchecker-paranoid', 'lean4lean': 'lean4lean',
                   'nanoda': 'nanoda', 'con-leche': 'con-leche', 'con-ron': 'con-ron'}
          with open(sys.argv[1], encoding='utf-8', errors='replace') as f:
              lines = f.read().split('\n')
          start, accept = ('Running ', ' kernel on solution'), ' kernel accepts the solution'
          ran = [l[len(start[0]):-len(start[1])] for l in lines if l.startswith(start[0]) and l.endswith(start[1])]
          accepted = {l[:-len(accept)] for l in lines if l.endswith(accept)}
          if 'Lean default' not in ran or any(k not in KNOWN or k not in accepted for k in ran):
              print('::error::lake check did not report the kernels this workflow knows, each accepting.')
              sys.exit(1)
          print(','.join(dict.fromkeys(KNOWN[k] for k in ran)))
          EOF

          # same_run.py checks that a validated result.json is for this repository and commit.
          cat > "$va/same_run.py" <<'EOF'
          import json, os, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              result = json.load(f)
          if (result['repo'].lower() != ('github.com/' + os.environ['GITHUB_REPOSITORY']).lower()
                  or result['commit'] != os.environ['GITHUB_SHA']):
              print('::error::The result is not for this repository and commit.')
              sys.exit(1)
          EOF

          # sandbox runs a native tool on hostile data as `lake check` runs its kernels: / read-only;
          # /home, /root, /run/user and /tmp empty, so none of the runner's files (the workspace,
          # GITHUB_ENV, GITHUB_OUTPUT) are there; no network; an empty environment; and only the
          # paths it is given bound back.
          #   sandbox [--ro PATH]... [--rw FILE]... [--setenv NAME VALUE]... -- COMMAND ARG...
          cat > "$va/sandbox" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          args=(--ro-bind / / --tmpfs /home --tmpfs /root --tmpfs /run/user --tmpfs /tmp --dir /tmp/home
                --dev /dev --proc /proc --clearenv --setenv HOME /tmp/home --setenv PATH /usr/bin:/bin)
          while [[ $# -gt 0 && $1 != -- ]]; do
            case $1 in
              --ro) args+=(--ro-bind "$2" "$2"); shift 2;;
              --rw) args+=(--bind "$2" "$2"); shift 2;;
              --setenv) args+=(--setenv "$2" "$3"); shift 3;;
              *) echo "sandbox: unknown option" >&2; exit 2;;
            esac
          done
          shift
          exec bwrap "${args[@]}" --unshare-all --die-with-parent --new-session -- "$@"
          EOF
          chmod +x "$va/sandbox"

      - &read-manifest
        name: Read the manifest
        id: manifest
        run: |
          va="$RUNNER_TEMP/va"
          python3 -I "$va/manifest_path.py"
          # The project folder, then the modules, one per line.
          python3 -I "$va/vacheck.pyz" modules "$MANIFEST" > "$va/modules"
          python3 -I "$va/theorems.py" "$va/vacheck.pyz" "$MANIFEST" > "$va/theorems"
          project=$(head -n 1 "$va/modules")
          python3 -I "$va/vacheck.pyz" toolchain "$project/lean-toolchain" > "$va/toolchain"
          python3 -I "$va/vacheck.pyz" deps "$project/lake-manifest.json"
          echo "The manifest names $(($(wc -l < "$va/modules") - 1)) modules and $(tr -cd '\0' < "$va/theorems" | wc -c) theorems."
          # The export's artifact, named after the manifest: artifacts are shared by the whole run,
          # and GitHub keeps two of the same name when two calls upload one at the same time.
          echo "export=export-$(printf '%s' "$MANIFEST" | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"

      - &install-toolchain
        name: Install the toolchain
        run: |
          read -r url sha < "$RUNNER_TEMP/va/toolchain"
          curl -fsSL --proto '=https' --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" "$url"
          echo "$sha  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          rm "$RUNNER_TEMP/lean.tar.zst"
          "$RUNNER_TEMP/lean/bin/lean" --version

      - name: Build
        run: |
          va="$RUNNER_TEMP/va"
          project=$(head -n 1 "$va/modules")
          mapfile -t modules < <(tail -n +2 "$va/modules")
          cd -- "$project"
          if ! "$RUNNER_TEMP/lean/bin/lake" build "${modules[@]/#/+}" 2>&1 | python3 -I "$va/say.py" "$va/vacheck.pyz"; then
            echo "::error::lake build failed."
            exit 1
          fi

      - name: Export the claimed theorems
        run: |
          va="$RUNNER_TEMP/va"
          project=$(head -n 1 "$va/modules")
          mapfile -t modules < <(tail -n +2 "$va/modules")
          mapfile -d '' -t theorems < "$va/theorems"
          mkdir "$RUNNER_TEMP/out"
          out="$RUNNER_TEMP/out/export.ndjson"
          cd -- "$project"
          # Only the claimed theorems and what they depend on: an export of everything in scope is
          # hundreds of megabytes even for a small project. A name leanexport cannot find is a
          # panic; LEAN_ABORT_ON_PANIC makes it fail instead of writing a partial export.
          set +o pipefail
          LEAN_ABORT_ON_PANIC=1 "$RUNNER_TEMP/lean/bin/lake" env leanexport "${modules[@]}" -- "${theorems[@]}" \
            2> "$va/export.log" | head -c "$((MAX_EXPORT + 1))" > "$out"
          status=${PIPESTATUS[0]}
          set -o pipefail
          size=$(stat -c %s "$out")
          if (( size > MAX_EXPORT )); then
            echo "::error::The export is larger than 2 GiB."
            exit 1
          fi
          if (( status != 0 )); then
            python3 -I "$va/say.py" "$va/vacheck.pyz" < "$va/export.log"
            echo "::error::leanexport failed: every claimed theorem must be in the manifest's modules."
            exit 1
          fi
          echo "The export is $size bytes."

      - name: Upload the export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.manifest.outputs.export }}
          path: ${{ runner.temp }}/out/export.ndjson
          retention-days: 1
          if-no-files-found: error

  check:
    name: check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      # The checkout is data: vacheck reads the manifest, the lean-toolchain and the Lake files, and
      # hashes the build inputs. Nothing in it is run, built or loaded.
      - *checkout

      - name: Install bubblewrap
        run: |
          # `lake check` runs the kernels in a bwrap sandbox without network, and so does the
          # sandbox script for nanoda and the reference; both need unprivileged user namespaces.
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q -o Acquire::Retries=3 bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all true

      - *get-checker

      # The same reading as in build, but here: nothing build says is trusted.
      - *read-manifest

      - *install-toolchain

      - name: Download the export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.manifest.outputs.export }}
          path: ${{ runner.temp }}/export

      - name: Replay the export through the kernels
        run: |
          va="$RUNNER_TEMP/va"
          lake="$RUNNER_TEMP/lean/bin/lake"
          export_file="$RUNNER_TEMP/export/export.ndjson"
          if [[ ! -f "$export_file" || -L "$export_file" ]] || (( $(stat -c %s "$export_file") > MAX_EXPORT )); then
            echo "::error::The export is missing or larger than 2 GiB."
            exit 1
          fi
          # An empty project of ours: `lake check` runs in it, so nothing of the repository's Lake
          # configuration is read.
          work=$(mktemp -d)
          echo "$work" > "$va/work"
          printf 'name = "vacheck_empty"\ndefaultTargets = ["Empty"]\n\n[[lean_lib]]\nname = "Empty"\n' \
            > "$work/lakefile.toml"
          cd "$work"
          "$lake" update 2>&1 | python3 -I "$va/say.py" "$va/vacheck.pyz"
          if ! "$lake" check --from-export "$export_file" --paranoid 2>&1 | tee "$va/check.log" \
              | python3 -I "$va/say.py" "$va/vacheck.pyz"; then
            echo "::error::The kernels rejected the export, or it uses an axiom other than propext, Quot.sound and Classical.choice."
            exit 1
          fi
          python3 -I "$va/kernels.py" "$va/check.log" > "$va/kernels"
          echo "Kernels that accepted the export: $(cat "$va/kernels")"

      - name: Export the references from the toolchain's libraries
        run: |
          # Every declaration in the export whose name a library of the toolchain declares, exported
          # from that library with the toolchain's own leanexport code, with what each depends on.
          # vacheck analyze compares them, so a project cannot redefine Eq, Nat or any other name of
          # the toolchain's. Init, Std, Lean and Lake are loaded together; every other library (each
          # of LeanChecker, LeanExport, LeanIR, Leanc and LakeMain defines `main`) is loaded alone,
          # for the names the four do not have. A library that cannot be loaded fails the check.
          # The names go through files, as data: the leanexport command line can neither take this
          # many nor write names such as _private.Init.Prelude.0.x.
          va="$RUNNER_TEMP/va"
          lean="$RUNNER_TEMP/lean"
          work=$(cat "$va/work")
          export_file="$RUNNER_TEMP/export/export.ndjson"
          python3 -I "$va/vacheck.pyz" names "$export_file" > "$work/names.jsonl"
          cat > "$work/Reference.lean" <<'EOF'
          import Lean.Data.Json.Parser
          import LeanExport.Basic

          open Lean

          /-- A name from the JSON array of its components: strings for `Name.str`, numbers for `Name.num`. -/
          def nameOf (j : Json) : Except String Name := do
            let comps ← j.getArr?
            if comps.isEmpty then throw "a name without components"
            comps.foldlM (init := .anonymous) fun n c =>
              match c with
              | .str s => pure (n.str s)
              | .num k =>
                if k.exponent == 0 && k.mantissa ≥ 0 then pure (n.num k.mantissa.toNat)
                else throw "a name component that is not a natural number"
              | _ => throw "a name component that is neither a string nor a number"

          /-- reference NAMES REST MODULE...: imports the modules, exports to stdout every declaration
          named in NAMES that they have, and writes the lines of NAMES that they lack to REST. -/
          def main (args : List String) : IO UInt32 := do
            let namesIn :: namesOut :: modules := args
              | throw <| IO.userError "usage: reference <names> <rest> <module>..."
            if modules.isEmpty then throw <| IO.userError "usage: reference <names> <rest> <module>..."
            initSearchPath (← findSysroot)
            let env ← importModules (modules.toArray.map fun m => { module := m.toName }) {}
            let mut found := #[]
            let mut rest := ""
            for line in ← IO.FS.lines namesIn do
              match Json.parse line >>= nameOf with
              | .ok n => if env.contains n then found := found.push n else rest := rest ++ line ++ "\n"
              | .error e => throw <| IO.userError s!"the names file: {e}"
            IO.FS.writeFile namesOut rest
            LeanExport.dumpEnv env found.toList ["--export-unsafe"]
            return 0
          EOF
          cd "$work"
          "$lean/bin/lean" -c reference.c Reference.lean
          "$lean/bin/leanc" -o reference reference.c -lLeanExport
          mkdir refs
          # reference NAMES REST OUT MODULE...: the reference program, in the sandbox. The paths are
          # absolute, because the sandbox has only them, not the folder they are in.
          reference() {
            local names=$1 rest=$2 out=$3
            shift 3
            : > "$rest"
            if ! "$va/sandbox" --ro "$lean" --ro "$work/reference" --ro "$names" --rw "$rest" \
                --setenv LEAN_SYSROOT "$lean" --setenv LEAN_ABORT_ON_PANIC 1 \
                -- "$work/reference" "$names" "$rest" "$@" > "$out" 2> reference.log; then
              python3 -I "$va/say.py" "$va/vacheck.pyz" < reference.log
              echo "::error::The toolchain's reference could not be exported from $*."
              exit 1
            fi
            echo "$out" >> "$va/references"
          }
          reference "$work/names.jsonl" "$work/rest.jsonl" "$work/refs/main.ndjson" Init Std Lean Lake
          # Every executable's library defines its own `main`, so a project's `main` is left to be
          # shown as the project's own, with its definition, rather than compared with one of them.
          grep -vxF '["main"]' rest.jsonl > lookup.jsonl || true
          libraries=0
          for olean in "$lean"/lib/lean/*.olean; do
            library=$(basename "$olean" .olean)
            case $library in Init|Std|Lean|Lake) continue;; esac
            reference "$work/lookup.jsonl" "$work/unused.jsonl" "$work/refs/$library.ndjson" "$library"
            libraries=$((libraries + 1))
          done
          if (( libraries == 0 )); then
            echo "::error::The toolchain has no library besides Init, Std, Lean and Lake."
            exit 1
          fi
          echo "The export has $(wc -l < names.jsonl) declarations; $(wc -l < rest.jsonl) are not in Init, Std, Lean or Lake."
          for f in refs/*.ndjson; do echo "Reference $(basename "$f" .ndjson): $(stat -c %s "$f") bytes."; done

      - name: Analyze
        run: |
          va="$RUNNER_TEMP/va"
          lean="$RUNNER_TEMP/lean"
          export_file="$RUNNER_TEMP/export/export.ndjson"
          read -r url _ < "$va/toolchain"
          version=${url%/*}
          version=${version##*/}
          # vacheck runs nanoda_bin to print the statements from the export: in the sandbox, with
          # the export and the configuration vacheck writes for it.
          cat > "$va/nanoda" <<EOF
          #!/bin/bash
          exec "$va/sandbox" --ro "\$1" --ro "$export_file" --ro "$lean/bin/nanoda_bin" -- "$lean/bin/nanoda_bin" "\$1"
          EOF
          chmod +x "$va/nanoda"
          references=()
          while read -r f; do references+=(--reference "$f"); done < "$va/references"
          if ! python3 -I "$va/vacheck.pyz" analyze \
            --export "$export_file" \
            "${references[@]}" \
            --manifest "$GITHUB_WORKSPACE/$MANIFEST" \
            --source "$GITHUB_WORKSPACE" \
            --repo "github.com/$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --toolchain "$version" \
            --kernels "$(cat "$va/kernels")" \
            --nanoda "$va/nanoda" \
            > "$va/result.json"; then
            echo "::error::The check failed: the line above says why."
            exit 1
          fi
          echo "The check passed: result.json is $(stat -c %s "$va/result.json") bytes, sha256 $(sha256sum < "$va/result.json" | cut -d ' ' -f 1)."

      - name: Hand the result to sign
        id: result
        run: |
          va="$RUNNER_TEMP/va"
          base64 -w0 "$va/result.json" > "$va/result.b64"
          if (( $(stat -c %s "$va/result.b64") > MAX_RESULT_B64 )); then
            echo "::error::result.json is larger than 96,000 bytes, too large to pass to job sign."
            exit 1
          fi
          { printf 'result='; cat "$va/result.b64"; echo; } >> "$GITHUB_OUTPUT"

  sign:
    name: sign
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - *get-checker

      - name: Validate the result
        env:
          RESULT: ${{ needs.check.outputs.result }}
        run: |
          va="$RUNNER_TEMP/va"
          if (( ${#RESULT} > MAX_RESULT_B64 )) || ! [[ "$RESULT" =~ ^[A-Za-z0-9+/]+=*$ ]]; then
            echo "::error::The result from job check is not the base64 of at most 96,000 bytes."
            exit 1
          fi
          printf '%s' "$RESULT" | base64 -d > "$va/received.json"
          python3 -I "$va/vacheck.pyz" validate "$va/received.json" > result.json
          if ! cmp -s "$va/received.json" result.json; then
            echo "::error::The result from job check is not canonical JSON."
            exit 1
          fi
          python3 -I "$va/same_run.py" result.json
          echo "result.json: sha256 $(sha256sum < result.json | cut -d ' ' -f 1)"

      - name: Sign the result
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: result.json
          predicate-type: https://verificationalliance.org/attestations/proof-check/v1
          predicate-path: result.json

      - name: Keep the bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" result.sigstore.json

      # Replaces any artifact of that name that another job of the run uploaded.
      - name: Upload the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osva-proof-result
          path: |
            result.json
            result.sigstore.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
