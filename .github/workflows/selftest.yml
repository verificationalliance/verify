# Runs lean.yml on fixtures, as a developer's repository would call it: `good`, `weak` and `println`
# must pass and be signed, `weak` and `good` with the sanity checks' warnings that the tests expect;
# `sorry`, `fakeeq`, `native`, `axiom` and `forge` must fail, all in job `check`;
# `dotlake`, a project with its .lake folder committed, must fail in `build`, before building.
# The run as a whole shows as failed, because they do; the assert jobs are the verdict. Three calls
# sign here, so the run's osva-proof-result is any one's: all are this repository and commit.
# `good`'s export is then checked again as our re-check checks one, by the check action in a job of
# its own, with the export downloaded from this run by its id: both must give the same result.json.
name: selftest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  good:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/good/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Claims that say less than they read: each gets the warnings tests/test_cli.py expects.
  weak:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/weak/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  sorry:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/sorry/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  fakeeq:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/fakeeq/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  native:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/native/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  axiom:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/axiom/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  # The project's own top-level `println`, which LeanChecker also declares. The project does not
  # import LeanChecker, so its `println` is its own: the check must pass.
  println:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/println/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  # The project's own LeanExport.dumpEnv, made while it imports another module of LeanExport: the
  # check must compare it with the toolchain's and fail.
  forge:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/forge/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  # A project with its .lake folder committed: refused before anything is built.
  dotlake:
    uses: ./.github/workflows/lean.yml
    with:
      manifest: tests/fixtures/dotlake/.verificationalliance.json
    permissions:
      contents: read
      id-token: write
      attestations: write

  # good's export, checked again as our re-check checks a developer's: this commit's check action,
  # in a job of its own, with the export of good's build downloaded from this run, by its id,
  # through the API.
  good-again:
    needs: good
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - name: Check out the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check good's export from this run, by its id
        id: check
        uses: ./.github/actions/check
        with:
          manifest: tests/fixtures/good/.verificationalliance.json
          repository: ${{ github.repository }}
          commit: ${{ github.sha }}
          export-run-id: ${{ github.run_id }}
          export-repository: ${{ github.repository }}

  # Two honest checks of one export must give the same bytes: a re-check that gave others would
  # refuse an honest result.
  byte-identical:
    needs: [good, good-again]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: good's check and its check again gave the same result.json
        env:
          FIRST: ${{ needs.good.outputs.result }}
          AGAIN: ${{ needs.good-again.outputs.result }}
        run: |
          test -n "$FIRST"
          test "$FIRST" = "$AGAIN"
          echo "Both checks gave result.json with sha256 $(printf '%s' "$FIRST" | base64 -d | sha256sum | cut -d ' ' -f 1)."

  assert:
    needs: [good, weak, println, sorry, fakeeq, native, axiom, forge, dotlake]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: good, weak and println passed, sorry failed
        env:
          GOOD: ${{ needs.good.result }}
          WEAK: ${{ needs.weak.result }}
          PRINTLN: ${{ needs.println.result }}
          SORRY: ${{ needs.sorry.result }}
        run: |
          echo "good: $GOOD, weak: $WEAK, println: $PRINTLN, sorry: $SORRY"
          test "$GOOD" = success
          test "$WEAK" = success
          test "$PRINTLN" = success
          test "$SORRY" = failure

      # The sanity checks: the helper ran to the end, and weak's and good's claims, in order, each
      # have the warnings that tests/test_cli.py expects of the same fixtures.
      - name: weak and good have the expected warnings
        env:
          WEAK: ${{ needs.weak.outputs.result }}
          GOOD: ${{ needs.good.outputs.result }}
        run: |
          python3 -I - <<'EOF'
          import base64, json, os
          WANT = {
              'WEAK': [
                  ('Weak.prog_safe', [('holds-for-any', 'Weak.prog', None), ('always-true', 'Weak.Safe', None)]),
                  ('Weak.sort_example', []),
                  ('Weak.add_zero_of_valid', [('holds-for-any', 'Weak.Valid', None), ('unused-assumption', 'h', None)]),
                  ('Weak.sort_length_self', [('holds-for-any', 'Weak.sort', None)]),
                  ('Weak.vacuous', [('holds-for-any', 'Weak.sort', None)]),
                  ('Weak.no_project', [('no-project-definition', None, None)]),
                  ('Weak.arrow', [('holds-for-any', 'Weak.Valid', None), ('unused-assumption', None, None)]),
                  ('Weak.by_lemma', [('no-project-definition', None, None)]),
              ],
              'GOOD': [
                  ('Good.t1', [('holds-for-any', 'Good.f', None)]),
                  ('Good.\u00abkey never leaves\u00bb', []),
                  ('Good.anyIn_nil', []),
                  ('Good.pick_lowest', [('holds-for-any', 'Good.lowest', None)]),
              ],
          }
          for var, want in WANT.items():
              result = json.loads(base64.b64decode(os.environ[var], validate=True))
              got = [(c['theorem'], [(w['check'], w['name'], w['arg']) for w in c['warnings']]) for c in result['claims']]
              print(var.lower(), result['schema'], result['sanity'], got == want)
              assert result['sanity'] == 'complete', result['sanity']
              assert got == want, got
          EOF

      - name: Download a signed result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osva-proof-result
          path: result

      # What our server checks: the bundle signs result.json, under our predicate type, from
      # lean.yml of this repository, on a GitHub-hosted runner.
      - name: The result is signed by lean.yml, for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify result/result.json --bundle result/result.sigstore.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/lean.yml" \
            --predicate-type https://verificationalliance.org/attestations/proof-check/v2 \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners

  # `sorry`, `fakeeq`, `native`, `axiom` and `forge` build fine, so they must be stopped by
  # `check`, the job that replays the export and compares it with the toolchain's libraries.
  # Failing in `build` would mean the trust check never ran. Only job names and conclusions are
  # read, never log text.
  assert-check:
    needs: [good, weak, println, sorry, fakeeq, native, axiom, forge, dotlake]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: The five failed in check, dotlake in build, and good, weak and println were signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv' > jobs.tsv
          cut -f1,2 jobs.tsv
          for c in sorry fakeeq native axiom forge; do
            test "$(awk -F'\t' -v n="$c / check" '$1 == n {print $2}' jobs.tsv)" = failure
            test "$(awk -F'\t' -v n="$c / build (untrusted)" '$1 == n {print $2}' jobs.tsv)" = success
            test "$(awk -F'\t' -v n="$c / sign" '$1 == n {print $2}' jobs.tsv)" != success
          done
          for c in good weak println; do
            test "$(awk -F'\t' -v n="$c / check" '$1 == n {print $2}' jobs.tsv)" = success
            test "$(awk -F'\t' -v n="$c / sign" '$1 == n {print $2}' jobs.tsv)" = success
          done
          test "$(awk -F'\t' -v n="dotlake / build (untrusted)" '$1 == n {print $2}' jobs.tsv)" = failure
          test "$(awk -F'\t' -v n="dotlake / check" '$1 == n {print $2}' jobs.tsv)" != success
          test "$(awk -F'\t' -v n="dotlake / sign" '$1 == n {print $2}' jobs.tsv)" != success
